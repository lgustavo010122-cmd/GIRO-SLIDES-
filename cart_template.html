<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var savedTheme=localStorage.getItem("giro-theme");if(savedTheme==="dark"||savedTheme==="light")document.documentElement.dataset.theme=savedTheme}catch(e){}</script>
<title>{{titulo_pagina}} · Meu carrinho</title>
<style>
:root{--bg:#fff;--soft:#f2f4f6;--card:#eceff2;--ink:#111418;--mut:#5f6b7a;--line:#d9dee5;--blue:#2f6fd0;--wa:#1f9d57;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e1116;--soft:#151a22;--card:#1b212b;--ink:#f1f3f7;--mut:#98a2b3;--line:#2a3140;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1116;--soft:#151a22;--card:#1b212b;--ink:#f1f3f7;--mut:#98a2b3;--line:#2a3140;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue","Segoe UI",Inter,Arial,sans-serif;line-height:1.5}a{color:inherit}.w{max-width:1040px;margin:auto;padding:0 22px}
header{border-bottom:1px solid var(--line)}nav{height:66px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:800;letter-spacing:.02em;text-decoration:none}nav a:last-child{color:var(--blue);font-size:14px;font-weight:650;text-decoration:none}
main{padding:48px 0 80px}.title-row{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}h1{font-size:clamp(32px,5vw,46px);line-height:1.08;letter-spacing:-.035em;margin:0}.subtitle{margin:8px 0 0;color:var(--mut)}.items{display:grid;gap:14px}.cart-item{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--card);padding:14px;border-radius:18px}.cart-item img{display:block;width:150px;height:120px;object-fit:cover;border-radius:12px}.product h2{font-size:18px;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 4px}.product p{margin:0;color:var(--mut);font-size:14px}.product .price{margin-top:9px;color:var(--ink);font-weight:700}.controls{display:flex;align-items:center;gap:10px}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg)}.qty button{width:38px;height:38px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}.qty button:disabled{opacity:.35;cursor:default}.qty output{min-width:32px;text-align:center;font-weight:700}.remove{border:0;background:none;color:var(--mut);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:8px}.remove:hover{color:#c44}.summary{margin-top:24px;margin-left:auto;max-width:430px;padding:20px;border:1px solid var(--line);border-radius:16px}.summary h2{font-size:19px;margin:0 0 4px}.summary p{color:var(--mut);font-size:14px;margin:0 0 16px}.checkout,.continue{display:flex;justify-content:center;align-items:center;min-height:48px;padding:0 20px;border-radius:99px;text-decoration:none;font-weight:700}.checkout{background:var(--wa);color:#fff}.continue{margin-top:10px;border:1px solid var(--line)}.empty{background:var(--soft);border-radius:18px;text-align:center;padding:48px 20px}.empty p{color:var(--mut);margin:0 0 18px}.empty a{display:inline-flex;background:var(--blue);color:#fff;border-radius:99px;padding:12px 20px;text-decoration:none;font-weight:700}
@media(max-width:650px){main{padding-top:32px}.title-row{align-items:start;flex-direction:column}.cart-item{grid-template-columns:92px 1fr;gap:12px;padding:10px}.cart-item img{width:92px;height:92px}.product h2{font-size:15px}.controls{grid-column:2;justify-content:space-between}.summary{max-width:none}.w{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header><nav class="w"><a class="logo" href="index.html">{{marca}}</a><a href="index.html#catalogo">← Continuar comprando</a></nav></header>
<main class="w"><div class="title-row"><div><h1>Meu carrinho</h1><p class="subtitle" id="count"></p></div></div><div class="items" id="items"></div><section class="summary" id="summary" hidden><h2>Sua cotação</h2><p>Confira os modelos e quantidades antes de continuar.</p><a class="checkout" id="checkout" href="#" target="_blank" rel="noopener">Solicitar cotação pelo WhatsApp</a><a class="continue" href="index.html#catalogo">Adicionar mais produtos</a></section></main>
<script>
var P={{produtos_js}},WHATSAPP={{whatsapp_js}},KEY="giro-cart";
var items=document.getElementById("items"),count=document.getElementById("count"),summary=document.getElementById("summary");
function readCart(){var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}var clean={};Object.keys(saved).forEach(function(i){var q=Math.floor(+saved[i]);if(P[+i]&&q>0)clean[i]=q});return clean}
function writeCart(cart){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function render(){var cart=readCart(),ids=Object.keys(cart).map(Number),units=ids.reduce(function(n,i){return n+cart[i]},0);count.textContent=units?units+(units===1?" unidade no carrinho":" unidades no carrinho"):"Seu carrinho está vazio";summary.hidden=!ids.length;if(!ids.length){items.innerHTML='<div class="empty"><p>Adicione produtos pelo catálogo para montar sua cotação.</p><a href="index.html#catalogo">Ver catálogo</a></div>';return}items.innerHTML=ids.map(function(i){var p=P[i],q=cart[i];return '<article class="cart-item"><img src="'+p.img+'" alt="'+p.n+' '+p.c+'"><div class="product"><h2>'+p.n+'</h2><p>'+p.c+'</p><p class="price">Atacado: '+p.p+'</p></div><div class="controls"><div class="qty" aria-label="Quantidade"><button type="button" data-action="minus" data-id="'+i+'" aria-label="Diminuir quantidade" '+(q<=1?'disabled':'')+'>−</button><output>'+q+'</output><button type="button" data-action="plus" data-id="'+i+'" aria-label="Aumentar quantidade">+</button></div><button class="remove" type="button" data-action="remove" data-id="'+i+'">Remover</button></div></article>'}).join("");var message="Olá! Gostaria de uma cotação de atacado da *Giro Slides*:\n"+ids.map(function(i){return "• "+cart[i]+"x "+P[i].n+" "+P[i].c+" — "+P[i].p+" cada"}).join("\n")+"\nPode me atender?";document.getElementById("checkout").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(message)}
items.addEventListener("click",function(e){var button=e.target.closest("[data-action]");if(!button)return;var cart=readCart(),id=button.dataset.id,action=button.dataset.action;if(action==="plus")cart[id]=(cart[id]||0)+1;else if(action==="minus"){cart[id]=(cart[id]||1)-1;if(cart[id]<=0)delete cart[id]}else if(action==="remove")delete cart[id];writeCart(cart);render()});
window.addEventListener("storage",render);render();
</script>
</body>
</html>
