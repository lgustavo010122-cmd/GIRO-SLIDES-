<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo_pagina}} · Carrinho</title>
<style>
:root{--bg:#fff;--soft:#f2f4f6;--card:#eceff2;--ink:#111418;--mut:#5f6b7a;--line:#d9dee5;--blue:#2f6fd0;--wa:#1f9d57;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--soft:#151a22;--card:#1b212b;--ink:#f1f3f7;--mut:#98a2b3;--line:#2a3140;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue","Segoe UI",Inter,Arial,sans-serif;line-height:1.5}a{color:inherit}.w{max-width:1000px;margin:auto;padding:0 22px}
header{border-bottom:1px solid var(--line)}nav{height:64px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:800;text-decoration:none;letter-spacing:.02em}nav a:last-child{color:var(--blue);font-weight:650;text-decoration:none}
main{padding:48px 0 80px}h1{font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-.03em;margin:0 0 8px}.intro{color:var(--mut);margin:0 0 28px}.items{display:grid;gap:12px}.cart-item{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;background:var(--card);border-radius:16px;padding:12px}.cart-item img{display:block;width:120px;height:96px;object-fit:cover;border-radius:10px}.details h2{font-size:18px;text-transform:uppercase;margin:0 0 3px}.details p{font-size:14px;color:var(--mut);margin:0}.price{font-weight:700;color:var(--ink);margin-top:8px!important}.remove{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 14px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}.remove:hover{border-color:#c44;color:#c44}.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:22px}.back,.checkout{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:0 22px;border-radius:99px;text-decoration:none;font-weight:700}.back{border:1px solid var(--line)}.checkout{background:var(--wa);color:#fff}.empty{padding:36px 20px;text-align:center;background:var(--soft);border-radius:16px}.empty p{color:var(--mut);margin:0 0 18px}.empty a{display:inline-flex;background:var(--blue);color:#fff;padding:12px 20px;border-radius:99px;text-decoration:none;font-weight:700}
@media(max-width:600px){main{padding-top:32px}.cart-item{grid-template-columns:88px 1fr;gap:12px}.cart-item img{width:88px;height:88px}.remove{grid-column:2;justify-self:start}.actions{flex-direction:column-reverse;align-items:stretch}.actions a{width:100%}}
</style>
</head>
<body>
<header><nav class="w"><a class="logo" href="index.html">{{marca}}</a><a href="index.html#catalogo">Continuar comprando</a></nav></header>
<main class="w"><h1>Seu carrinho</h1><p class="intro" id="count"></p><div class="items" id="items"></div><div class="actions" id="actions" hidden><a class="back" href="index.html#catalogo">Continuar comprando</a><a class="checkout" id="checkout" target="_blank" rel="noopener">Pedir cotação pelo WhatsApp</a></div></main>
<script>
var P={{produtos_js}},WHATSAPP={{whatsapp_js}},KEY="giro-cart";
var items=document.getElementById("items"),count=document.getElementById("count"),actions=document.getElementById("actions");
function selected(){var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}return Object.keys(saved).map(Number).filter(function(i){return Number.isInteger(i)&&P[i]})}
function render(){var ids=selected();count.textContent=ids.length?ids.length+(ids.length===1?" produto selecionado":" produtos selecionados"):"Seu carrinho está vazio.";actions.hidden=!ids.length;if(!ids.length){items.innerHTML='<div class="empty"><p>Adicione produtos pelo catálogo para montar sua cotação.</p><a href="index.html#catalogo">Ver catálogo</a></div>';return}items.innerHTML=ids.map(function(i){var p=P[i];return '<article class="cart-item"><img src="'+p.img+'" alt="'+p.n+' '+p.c+'"><div class="details"><h2>'+p.n+'</h2><p>'+p.c+'</p><p class="price">Atacado: '+p.p+'</p></div><button class="remove" type="button" data-remove="'+i+'">Remover</button></article>'}).join("");var text="Olá! Gostaria de uma cotação de atacado da *Giro Slides*:\n"+ids.map(function(i){return "• "+P[i].n+" "+P[i].c+" — "+P[i].p}).join("\n")+"\nPode me atender?";document.getElementById("checkout").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(text)}
items.addEventListener("click",function(e){var button=e.target.closest("[data-remove]");if(!button)return;var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(err){}delete saved[button.dataset.remove];localStorage.setItem(KEY,JSON.stringify(saved));render()});
render();
</script>
</body>
</html>
